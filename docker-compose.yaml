# docker compose build
# docker compose run --rm state_estimation bash

services:
  state_estimation:
    build:
      context: docker
      dockerfile: Dockerfile_ros2
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: path_planning-image
    container_name: state_estimation-container
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/home/ubuntu/.Xauthority   # ← important: point to home, not /tmp
      # - XDG_RUNTIME_DIR=/run/user/1000
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      # - "/tmp/.docker.xauth:/tmp/.docker.xauth"
      - "${HOME}/.Xauthority:/home/ubuntu/.Xauthority:ro"   # ← Mount host's real .Xauthority
      - ${PWD}/state_estimation:/home/ubuntu/state_estimation:rw
    network_mode: host
    tty: true
    stdin_open: true
    working_dir: /home/ubuntu/state_estimation
    command: /bin/bash
    restart: unless-stopped
